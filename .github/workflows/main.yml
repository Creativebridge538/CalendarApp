name: Sync to Client

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Push to Client
        run: |
          git config user.name "eve8008"
          git config user.email "eve.p.impact@gmail.com"

          # Vercel(Hobbyプラン)はコミット作者がプロジェクトへのアクセス権を持っていないと
          # デプロイをブロックするため、client側にpushする直前にHEADコミットの作者を
          # client側オーナー(eve8008)に付け替える。force pushで転送するだけだと元の
          # 作者情報がそのまま残ってしまい、毎回デプロイがブロックされていた
          git commit --amend --author="eve8008 <eve.p.impact@gmail.com>" --no-edit

          git remote add client https://x-access-token:${{ secrets.W6_TOKEN }}@github.com/eve8008/CalendarApp.git

          git push client main:main --force
